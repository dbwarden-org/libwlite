[project]
site_name = "libwlite Documentation"
site_description = "libwlite: A small C library for SQLite schema management, migrations, and queries. Core runtime for wlite."
site_url = "https://libwlite.dbwarden.org"
docs_dir = "docs"
site_dir = "site"

copyright = "&copy; 2026 Emiliano Gandini Outeda"

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"

font.text = "Ubuntu"
font.code = "JetBrains Mono"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/dbwarden-org/libwlite"
name = "libwlite on GitHub"

[[project.nav]]
Overview = [
  {Overview = "index.md"},
  {Architecture = "architecture.md"},
]

[[project.nav]]
"API Reference" = [
  {"C API" = "c-api.md"},
  {"Grammar" = "grammar.md"},
]

[project.markdown_extensions]
"seoslug.contrib.zensical" = {
  canonical_host = "dbwarden.org",
  public_base_url = "https://libwlite.dbwarden.org/",
  site_name = "libwlite Documentation",
  title_template = "{title} - libwlite",
  publisher_name = "Emiliano Gandini Outeda",
  locale = "en_US",
  auto_generate_schema = true,
}

[project.markdown_extensions.tables]
[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
